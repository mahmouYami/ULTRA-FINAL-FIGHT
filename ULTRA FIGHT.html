<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">

<title>ULTRA FINAL FIGHT - مراجعة سلوك تنظيمي</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { --bg-main: #09090b; --bg-card: #18181b; --rose-pink: #f43f5e; --rose-purple: #a855f7; --text-light: #f8fafc; --text-muted: #94a3b8; --glow-pink: 0 0 20px rgba(244, 63, 94, 0.4); --glow-purple: 0 0 20px rgba(168, 85, 247, 0.4); --radius-md: 15px; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-light); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; overflow-x: hidden; }
        .page-container { display: none; width: 100%; max-width: 900px; animation: fadeIn 0.4s ease; }
        .active-page { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        .landing-box { text-align: center; background: var(--bg-card); padding: 30px; border-radius: 20px; border: 2px solid var(--rose-pink); box-shadow: var(--glow-pink); }
        .goku-banner-container { width: 100%; border-radius: 15px; overflow: hidden; border: 2px solid var(--rose-purple); box-shadow: var(--glow-purple); margin-bottom: 25px; height: 350px; }
        .goku-banner { width: 100%; height: 100%; object-fit: cover; }
        .landing-title { font-size: 32px; font-weight: 900; background: linear-gradient(90deg, var(--rose-pink), var(--rose-purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 25px; }
        .buttons-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        @media (max-width: 600px) { .buttons-grid { grid-template-columns: 1fr; } }
        .btn-main { padding: 15px; font-size: 18px; font-weight: bold; border: none; border-radius: 12px; cursor: pointer; transition: 0.3s; color: white; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .btn-study { background: linear-gradient(45deg, #1e1b4b, var(--rose-purple)); border: 1px solid var(--rose-purple); grid-column: 1 / -1; font-size: 22px; padding: 20px; }
        .btn-quiz-1 { background: linear-gradient(45deg, #4c0519, var(--rose-pink)); border: 1px solid var(--rose-pink); }
        .btn-quiz-2 { background: linear-gradient(45deg, #3b0764, #9333ea); border: 1px solid #9333ea; }
        .btn-quiz-3 { background: linear-gradient(45deg, #0f172a, #3b82f6); border: 1px solid #3b82f6; grid-column: 1 / -1; }
        .btn-main:hover { transform: scale(1.03); box-shadow: 0 0 20px rgba(255, 255, 255, 0.15); }
        .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; border-bottom: 1px solid #27272a; padding-bottom: 15px; }
        .back-btn { background: transparent; color: var(--rose-pink); border: 1px solid var(--rose-pink); padding: 8px 15px; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .back-btn:hover { background: var(--rose-pink); color: white; }
        .page-title { color: var(--text-light); font-size: 20px; font-weight: bold; }
        .chapter-title { color: var(--rose-purple); font-size: 24px; margin: 30px 0 15px; border-bottom: 2px dashed var(--rose-pink); padding-bottom: 10px; }
        .accordion-item { background-color: var(--bg-card); border: 1px solid #27272a; border-radius: var(--radius-md); margin-bottom: 15px; overflow: hidden; transition: 0.3s; }
        .accordion-header { padding: 20px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-weight: bold; font-size: 18px; color: var(--text-light); }
        .accordion-header:hover { background-color: #27272a; }
        .accordion-content { max-height: 0; overflow: hidden; padding: 0 20px; background-color: #121214; opacity: 0; transition: all 0.4s ease; line-height: 1.8; font-size: 16px; }
        .accordion-item.active { border-color: var(--rose-purple); box-shadow: var(--glow-purple); }
        .accordion-item.active .accordion-header { background-color: #27272a; color: var(--rose-pink); }
        .accordion-item.active .accordion-icon { transform: rotate(180deg); color: var(--rose-pink); }
        .accordion-item.active .accordion-content { max-height: 5000px; padding: 20px; opacity: 1; border-top: 1px solid #27272a; }
        .highlight-box { background: rgba(244, 63, 94, 0.1); border-right: 4px solid var(--rose-pink); padding: 15px; margin: 15px 0; border-radius: 8px; }
        .highlight-text { color: var(--rose-pink); font-weight: bold; }
        .stats-bar { display: flex; justify-content: space-between; background-color: var(--bg-card); padding: 15px; border-radius: 12px; font-weight: bold; border: 1px solid var(--rose-purple); margin-bottom: 20px; }
        .stat-box.correct { color: #4ade80; }
        .stat-box.wrong { color: var(--rose-pink); }
        .stat-box.remaining { color: var(--rose-purple); }
        .progress-container { background-color: #27272a; height: 8px; border-radius: 4px; margin-bottom: 25px; overflow: hidden; }
        .progress-bar { background: linear-gradient(90deg, var(--rose-pink), var(--rose-purple)); height: 100%; width: 0%; transition: width 0.3s; }
        .question-box { font-size: 20px; line-height: 1.6; margin-bottom: 25px; font-weight: bold; }
        .choices-list { display: flex; flex-direction: column; gap: 12px; }
        .choice-btn { background-color: var(--bg-card); color: var(--text-light); border: 1px solid #3f3f46; padding: 15px 20px; border-radius: 12px; text-align: right; font-size: 16px; cursor: pointer; transition: 0.2s; font-weight: bold; }
        .choice-btn:hover:not(:disabled) { border-color: var(--rose-purple); background-color: #27272a; }
        .choice-btn:disabled { cursor: not-allowed; opacity: 0.8; }
        .choice-btn.correct-ans { background-color: #065f46 !important; border-color: #10b981 !important; color: white; }
        .choice-btn.wrong-ans { background-color: #881337 !important; border-color: var(--rose-pink) !important; color: white; }
        .explanation-box { margin-top: 20px; padding: 15px; border-radius: 8px; background-color: #18181b; border-right: 4px solid var(--rose-purple); display: none; line-height: 1.6; font-size: 15px; }
        .next-btn { display: none; width: 100%; margin-top: 25px; background: linear-gradient(90deg, var(--rose-pink), var(--rose-purple)); color: white; border: none; padding: 15px; border-radius: 12px; font-size: 18px; font-weight: bold; cursor: pointer; }
        .score-circle { width: 150px; height: 150px; border-radius: 50%; border: 5px solid var(--rose-purple); display: flex; align-items: center; justify-content: center; font-size: 40px; font-weight: bold; margin: 0 auto 20px; box-shadow: var(--glow-purple); }
        .btn-quiz-4 { background: linear-gradient(45deg, #1e293b, #f43f5e); border: 1px solid var(--rose-pink); grid-column: 1 / -1; }
        .btn-quiz-comprehensive { 
    background: linear-gradient(45deg, #0f172a, #0ea5e9); 
    border: 1px solid #0ea5e9; 
    grid-column: 1 / -1; 
}
.btn-quiz-yearwork { 
    background: linear-gradient(45deg, #1e1b4b, #f59e0b); 
    border: 1px solid #f59e0b; 
    grid-column: 1 / -1; 
}
.btn-quiz-expected { 
    background: linear-gradient(45deg, #4c0519, #10b981); 
    border: 1px solid #10b981; 
    grid-column: 1 / -1; 
}


    </style>
</head>
<body>

    <div id="landing-view" class="page-container active-page">
        <div class="landing-box">
            <div class="goku-banner-container">
                <img src="https://i.pinimg.com/736x/f8/6a/5e/f86a5ed1bce12165b7c9da93c8e5cb4f.jpg" class="goku-banner" alt="Banner Image">
            </div>
            
<h1 class="landing-title">ULTRA FINAL FIGHT 💥</h1>
            <p style="color: var(--rose-purple); font-weight: 900; font-size: 18px; margin-bottom: 25px; text-shadow: var(--glow-purple); text-align: center;">Developed By: Mahmoud Mosaad</p>

            <div class="buttons-grid">
           
                <button class="btn-main btn-quiz-1" onclick="startQuiz('midterm')"><i class="fa-solid fa-bolt"></i> امتحان الميدتيرم</button>
                <button class="btn-main btn-quiz-2" onclick="startQuiz('lastYear')"><i class="fa-solid fa-fire"></i> امتحان العام الماضي</button>
                <button class="btn-main btn-quiz-3" onclick="startQuiz('general')"><i class="fa-solid fa-brain"></i> بنك أسئلة الكويز</button>
         <button class="btn-main btn-quiz-4" onclick="startQuiz('hanin')"><i class="fa-solid fa-trophy"></i> D / Hanin</button>

<button class="btn-main btn-quiz-comprehensive" onclick="startQuiz('comprehensive')"><i class="fa-solid fa-star"></i> اختبار شامل</button>
<button class="btn-main btn-quiz-yearwork" onclick="startQuiz('yearWork')"><i class="fa-solid fa-calendar-days"></i> اختبار أعمال السنة</button>
<button class="btn-main btn-quiz-expected" onclick="startQuiz('expected')"><i class="fa-solid fa-bomb"></i> أهم الأسئلة المتوقعة</button>
                
            </div>
        </div>
    </div>

   

    <div id="quiz-view" class="page-container">
        <div class="header-bar">
            <button class="back-btn" onclick="switchView('landing-view');"><i class="fa-solid fa-arrow-right"></i> إنهاء الامتحان</button>
            <div class="page-title" id="quiz-title-display">جاري التحميل...</div>
        </div>
        <div class="stats-bar">
            <div class="stat-box correct">صحيح: <span id="correct-count">0</span></div>
            <div class="stat-box wrong">خطأ: <span id="wrong-count">0</span></div>
            <div class="stat-box remaining">متبقي: <span id="remaining-count">0</span></div>
        </div>
        <div class="progress-container"><div id="progress-bar" class="progress-bar"></div></div>
        <div class="question-box" id="question-text">جاري تحميل السؤال...</div>
        <div class="choices-list" id="choices-container"></div>
        <div class="explanation-box" id="explanation-box"></div>
        <button class="next-btn" id="next-btn" onclick="nextQuestion()">السؤال التالي <i class="fa-solid fa-arrow-left"></i></button>
    </div>

    <div id="score-view" class="page-container">
        <div class="landing-box">
            <h1 class="landing-title">تمت المهمة بنجاح!</h1>
            <p style="margin-bottom: 20px; font-size: 18px; color: var(--text-muted);">طاقتك وصلت للحد الأقصى، درجتك هي:</p>
            <div class="score-circle"><span id="final-score">0</span></div>
            <button class="btn-main btn-study" style="margin: 0 auto; padding: 15px 30px; font-size: 18px;" onclick="switchView('landing-view')"><i class="fa-solid fa-house"></i> العودة للرئيسية</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script>
        // دالة فتح وقفل المحاضرات
        function toggleAccordion(header) {
            const item = header.parentElement;
            const allItems = document.querySelectorAll('.accordion-item');
            allItems.forEach(i => { if (i !== item) i.classList.remove('active'); });
            item.classList.toggle('active');
            if (item.classList.contains('active')) { setTimeout(() => item.scrollIntoView({ behavior: 'smooth', block: 'center' }), 150); }
        }

        // دالة التنقل بين الشاشات
        function switchView(viewId) {
            document.querySelectorAll('.page-container').forEach(page => page.classList.remove('active-page'));
            document.getElementById(viewId).classList.add('active-page');
        }

        // ==========================================
        // مصفوفات الأسئلة (ضع أسئلتك هنا)
        // ==========================================
        
        // 1. أسئلة الميدتيرم
        const midtermQuestions = [
           {
    q: 'الثقافة التنظيمية متشابهة تمامًا في جميع المنظمات ولا تختلف؟',
    c: ['صح', 'خطأ'],
    a: 1,
    exp: 'التصحيح: تختلف الثقافة من مكان لمكان، ولكل منظمة ثقافة خاصة بها.'
  },
  {
    q: 'مرحلة من مراحل الانتماء تبدأ بعد خمس سنوات وتعكس الثقة بالمنظمة؟',
    c: ['مرحلة الإنجاز', 'مرحلة الخروج', 'مرحلة التجربة', 'مرحلة الثقة'],
    a: 3,
    exp: 'تبدأ في السنة الخامسة وفيها يتم الانتقال إلى مرحلة النضج.'
  },
  {
    q: 'مكون من مكونات الشخصية يعكس المعتقدات والاتجاهات نحو العدالة والإنصاف في العمل؟',
    c: ['الانفعالات', 'الالقيم', 'الحاجات', 'الاهتمامات'],
    a: 1,
    exp: 'القيم هي المعيار الأساسي الذي يرى الفرد من خلاله كيف يجب أن يكون سلوكه وسلوك الآخرين وتنعكس على سلوكه الخارجي.'
  },
  {
    q: 'نوع من الثقافة التنظيمية يتميز بالصداقة والمساعدة والتعاون؟',
    c: ['الثقافة البيروقراطية', 'الثقافة المساندة', 'ثقافة الدور', 'ثقافة المهمة'],
    a: 1,
    exp: 'تتميز بالصداقة، والمساعدة، وجو الأسرة المتعاونة.'
  },
  {
    q: 'الثقافة التنظيمية القوية يمكن أن تكون مصدر ميزة تنافسية للمنظمة؟',
    c: ['صح', 'خطأ'],
    a: 0,
    exp: 'تعتبر ميزة تنافسية للمنظمة إذا كانت تؤكد على سلوكيات ابتكارية مثل التفاني في العمل.'
  },
  {
    q: 'من وظائف الثقافة التنظيمية التالية يُعد أساسياً؟',
    c: ['القضاء على التنوع الوظيفي', 'ضمان النجاح المالي', 'توفير إطار مشترك لفهم الأحداث', 'تقليل الحاجة إلى القيادة'],
    a: 2,
    exp: 'تقديم إطار للفهم المشترك للأحداث والظواهر المستجدة.'
  },
  {
    q: 'ثقافة البيروقراطية تركز على الإبداع والمخاطرة؟',
    c: ['صح', 'خطأ'],
    a: 1,
    exp: 'التصحيح: الثقافة الإبداعية هي التي تتصف بالجرأة والمخاطرة، أما البيروقراطية فتقوم على التحكم والالتزام والتسلسل الهرمي.'
  },
  {
    q: 'الالقيم توجه سلوك الفرد وتنعكس على أدائه وعلاقاته بالآخرين؟',
    c: ['صح', 'خطأ'],
    a: 0,
    exp: 'القيم توجه سلوك الأفراد وتنعكس على الأداء.'
  },
  {
    q: 'الانتماء المعياري يعني أن الموظف يبقى لأنه يشعر بالالتزام الأخلاقي تجاه المنظمة؟',
    c: ['صح', 'خطأ'],
    a: 0,
    exp: 'القيم توجه سلوك الأفراد وتنعكس على الأداء.'
  },
  {
    q: 'الانتماء العاطفي يقوم على أساس حساب التكاليف والمكاسب المرتبطة بترك المنظمة؟',
    c: ['صح', 'خطأ'],
    a: 1,
    exp: 'التصحيح: الانتماء المستمر هو الذي يقوم على حساب التكاليف والاستثمارات مثل الوقت والجهد والمكافآت، أما العاطفي فيقوم على الارتباط النفسي والافتخار بالانتساب.'
  },
  {
    q: 'أي من وظائف الثقافة التنظيمية التالية يُعد أساسياً؟',
    c: ['القضاء على التنوع الوظيفي', 'ضمان النجاح المالي', 'توفير إطار مشترك لفهم الأحداث', 'تقليل الحاجة إلى القيادة'],
    a: 2,
    exp: 'النص الحرفي في المادة: تقديم إطار للفهم المشترك للأحداث والظواهر المستجدة.'
  },
  {
    q: 'أي مما يلي يصف الانتماء المستمر؟',
    c: ['البقاء لتحقيق الابتكار', 'البقاء بسبب تكلفة ترك المنظمة', 'البقاء بسبب الالتزام الأخلاقي', 'البقاء بسبب الارتباط العاطفي'],
    a: 1,
    exp: 'لأن العامل بنى استثمارات من الوقت والجهد والمكافآت التي لا تجعله يسعى لعمل بديل.'
  },
  {
    q: 'لماذا تُعتبر الثقافة القوية ميزة تنافسية؟',
    c: ['لأنها توحد سلوك العاملين مع أهداف المنظمة', 'لأنها تقلل التكاليف تلقائيًا', 'لأنها تلغي الحاجة إلى التدريب', 'لأنها تضمن الابتكار دائمًا'],
    a: 0,
    exp: 'حيث تمثل إطاراً فكرياً يوجه أعضاء المنظمة الواحدة وينظم أعمالهم وتؤكد على التفاني.'
  },
  {
    q: 'الاستقرار الانفعالي يشير إلى درجة تقلب المزاج والقلق عند الفرد.؟',
    c: ['صح', 'خطأ'],
    a: 0,
    exp: 'الانفعالات تشير لخصائص الحالة المزاجية للفرد ومدى استقراره الانفعالي أو تقلب مزاجه.'
  },
  {
    q: 'مرحلة التجربة بعد التعيين تستمر عادة حوالي سنة وتركز على الأمن والقبول الوظيفي ؟',
    c: ['صح', 'خطأ'],
    a: 0,
    exp: 'تكون مدتها عاماً تقريباً ويكون التوجه الرئيسي هو الحصول على القبول والأمن الوظيفي.'
  },
  {
    q: 'أي نوع من الانتماء يرتبط بالولاء والفخر بالانتماء للمنظمة؟',
    c: ['الانتماء المستمر', 'الانتماء الحسابي', 'الانتماء المعياري', 'الانتماء العاطفي'],
    a: 3,
    exp: 'يبنى على أساس الشعور القوي بالانتماء والافتخار بالانتساب إليها والارتباط بها.'
  },
  {
    q: 'السمات الشخصية وحدها كافية للتنبؤ بسلوك الأفراد في العمل بدقة ؟',
    c: ['صح', 'خطأ'],
    a: 1,
    exp: 'النص الحرفي في المادة: يصعب جداً الاعتماد عليها؛ لأن سمة الفرد تكون محصلة لمجموعة تانية من السمات.'
  },
  {
    q: 'أي من الحاجات التالية تُعد حاجة مستقرة تؤثر في الشخصية؟',
    c: ['الحاجة إلى الإنجاز', 'النوم', 'الجوع', 'العطش'],
    a: 0,
    exp: 'المادة قسمت الحاجات إلى وقتية مثل الطعام والشراب والراحة، ومستقرة مثل الحاجة للإنجاز والقوة والنفوذ والانتماء.'
  },
  {
    q: 'الانتماء المستمر يعكس استثمارات الموظف في المنظمة مثل الوقت والمهارات والمكافآت؟',
    c: ['صح', 'خطأ'],
    a: 0,
    exp: 'يعتمد على أن العامل يبني استثمارات تشتمل على الوقت والجهد الوظيفي والمهارات المكتسبة والمكافآت.'
  },
  {
    q: 'مما يلي ليس من مكونات الشخصية الأساسية؟',
    c: ['الحاجات', 'الراتب', 'الانفعالات', 'القيم'],
    a: 1,
    exp: 'الراتب (المكونات الستة الأساسية للشخصية في المادة هي: القيم، الانفعالات، الحاجات، القدرات، الاتجاهات النفسية، والميول).'
  },
    {
    q: 'صعوبة العمل تنشأ غالباً من عدم وضوح المهام أو تجاوز حجم العمل لقدرات الفرد.',
    c: ['صح', 'خطأ'],
    a: 0,
    exp: 'الإجابة الصحيحة: صح'
  },
  {
    q: 'من الطرق التنظيمية لعلاج ضغوط العمل إعادة تصميم الوظائف لتكون ذات معنى وأهمية.',
    c: ['صح', 'خطأ'],
    a: 0,
    exp: 'الإجابة الصحيحة: صح'
  },
  {
    q: 'مجرد وجود مجموعة من الأفراد في مكان واحد يعني أنهم يشكلون جماعة عمل.',
    c: ['صح', 'خطأ'],
    a: 1,
    exp: 'الإجابة الصحيحة: خطأ'
  },
  {
    q: 'وضوح أهداف الجماعة في أذهان الأعضاء ليس شرطاً لتطوير العمل الجماعي.',
    c: ['صح', 'خطأ'],
    a: 1,
    exp: 'الإجابة الصحيحة: خطأ'

        // منطق تشغيل الاختبارات
        // ==========================================
        let activeQuiz = [];
        let currentIndex = 0;
        let correctAnswers = 0;
        let wrongAnswers = 0;
        let hasAnswered = false;

                function startQuiz(type) {
            if (type === 'midterm') { 
                activeQuiz = midtermQuestions; 
                document.getElementById('quiz-title-display').innerText = "امتحان الميدتيرم"; 
            }
            else if (type === 'lastYear') { 
                activeQuiz = lastYearQuestions; 
                document.getElementById('quiz-title-display').innerText = "امتحان العام الماضي"; 
            }
            else if (type === 'general') { 
                activeQuiz = generalQuestions; 
                document.getElementById('quiz-title-display').innerText = "بنك أسئلة الكويز"; 
            }
                    else if (type === 'hanin') { 
            activeQuiz = comprehensiveQuestions; 
            document.getElementById('quiz-title-display').innerText = "D / Hanin"; 
        }
        else if (type === 'comprehensive') { 
            activeQuiz = comprehensiveQuestionsNew; 
            document.getElementById('quiz-title-display').innerText = "اختبار شامل"; 
        }
            else if (type === 'yearWork') { 
                activeQuiz = yearWorkQuestions; 
                document.getElementById('quiz-title-display').innerText = "اختبار أعمال السنة"; 
            }
            else if (type === 'expected') { 
                activeQuiz = expectedQuestions; 
                document.getElementById('quiz-title-display').innerText = "أهم الأسئلة المتوقعة"; 
            }
            
            // تصفير العدادات وبدء الاختبار
            currentIndex = 0; 
            correctAnswers = 0; 
            wrongAnswers = 0;
            switchView('quiz-view');
            showQuestion();
        }



        function showQuestion() {
            hasAnswered = false;
            document.getElementById('next-btn').style.display = 'none';
            document.getElementById('explanation-box').style.display = 'none';
            document.getElementById('correct-count').innerText = correctAnswers;
            document.getElementById('wrong-count').innerText = wrongAnswers;
            document.getElementById('remaining-count').innerText = activeQuiz.length - currentIndex;
            document.getElementById('progress-bar').style.width = ((currentIndex / activeQuiz.length) * 100) + '%';

            let currentQ = activeQuiz[currentIndex];
            if(!currentQ) return; 
            
            document.getElementById('question-text').innerText = `سؤال ${currentIndex + 1} من ${activeQuiz.length}: ${currentQ.q}`;
            let choicesContainer = document.getElementById('choices-container');
            choicesContainer.innerHTML = '';
            currentQ.c.forEach((choice, index) => {
                let btn = document.createElement('button');
                btn.className = 'choice-btn';
                btn.innerText = choice;
                btn.onclick = () => checkAnswer(index, btn);
                choicesContainer.appendChild(btn);
            });
        }

        function checkAnswer(selectedIndex, clickedBtn) {
            if (hasAnswered) return;
            hasAnswered = true;
            let currentQ = activeQuiz[currentIndex];
            let buttons = document.querySelectorAll('.choice-btn');
            buttons.forEach(btn => btn.disabled = true);

            if (selectedIndex === currentQ.a) {
                clickedBtn.classList.add('correct-ans'); correctAnswers++;
            } else {
                clickedBtn.classList.add('wrong-ans'); buttons[currentQ.a].classList.add('correct-ans'); wrongAnswers++;
            }
            document.getElementById('correct-count').innerText = correctAnswers;
            document.getElementById('wrong-count').innerText = wrongAnswers;
            let expBox = document.getElementById('explanation-box');
            expBox.innerHTML = `<strong>توضيح:</strong> ${currentQ.exp || "الإجابة الصحيحة موضحة بالأخضر"}`;
            expBox.style.display = 'block';
            document.getElementById('next-btn').style.display = 'block';
        }

        function nextQuestion() {
            currentIndex++;
            if (currentIndex < activeQuiz.length) { showQuestion(); } 
            else {
                document.getElementById('progress-bar').style.width = '100%';
                switchView('score-view');
                document.getElementById('final-score').innerText = `${correctAnswers} / ${activeQuiz.length}`;
                fireConfetti(); 
            }
        }

        // دالة الاحتفال (الورق الملون)
        function fireConfetti() {
            var duration = 4 * 1000; 
            var end = Date.now() + duration;
            (function frame() {
                confetti({ particleCount: 5, angle: 60, spread: 55, origin: { x: 0 }, colors: ['#f43f5e', '#a855f7', '#f8fafc'] });
                confetti({ particleCount: 5, angle: 120, spread: 55, origin: { x: 1 }, colors: ['#f43f5e', '#a855f7', '#f8fafc'] });
                if (Date.now() < end) requestAnimationFrame(frame);
            }());
        }
    </script>
